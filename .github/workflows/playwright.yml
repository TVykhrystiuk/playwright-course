name : Playwright Tests
on: 
  push:
    branches: [main]
jobs:
  playwrighttests: # any name
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.46.0-focal
      env:
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v2
      - name: Say hello
        run: echo Hello
      - name: Run tests
        run: |
          echo "Start the shopping store application"
          chmod +x ./shopping-store-linux-amd64
          ./shopping-store-linux-amd64 &
          echo "Install dependencies from lockfile"
          npm ci
          echo "Run playwright tests"
          npm run test:ci
